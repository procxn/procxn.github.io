<main>
<section class="section">
  <div class="album-grid" id="album-grid"></div>
  <p class="note">※ 想投稿照片？把图片发给站长，注明年份与场合即可。已整理的图册点开即可浏览，支持键盘左右键翻页。</p>
</section>
</main>

<footer class="footer">
  <p>联动计划 Procxn · 2012–2018 · 纪念档案馆</p>
  <p class="footer-small">本站为老成员自发维护 · 托管于 GitHub Pages · 域名 procxn.org</p>
</footer>

<script src="data.js"></script>
<script>
(function () {
  var grid = document.getElementById('album-grid');
  if (!SITE_DATA.albums.length) {
    grid.innerHTML = '<div class="empty-state"><span class="ico">📷</span>图册整理中，敬请期待。</div>';
    return;
  }
  grid.innerHTML = SITE_DATA.albums.map(function (a) {
    var cover = a.cover
      ? '<img class="cover" src="' + a.cover + '" alt="' + a.title + '" loading="lazy">'
      : '<div class="cover empty" style="height:170px">待补照片</div>';
    return '<a class="album-card" href="album.html?album=' + encodeURIComponent(a.id) + '">' +
           cover +
           '<div class="meta"><span class="yr">' + a.year + '</span><h3>' + a.title + '</h3>' +
           '<p>' + (a.photos.length ? '共 ' + a.photos.length + ' 张 · ' : '') + a.desc + '</p>' +
           '</div></a>';
  }).join('');
})();
</script>
</body>
</html>
