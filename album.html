<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图册 · 联动计划 Procxn 纪念档案馆</title>
<meta property="og:title" content="图册 · 联动计划纪念档案馆">
<meta property="og:description" content="那些年我们开过的会、熬过的夜、拍下的合影。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.procxn.org/assets/og-image.png">
<meta property="og:site_name" content="联动计划纪念档案馆">
<meta property="og:locale" content="zh_CN">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%231f2a44'/%3E%3Ctext x='50' y='63' font-size='42' text-anchor='middle' fill='%23e8c979' font-family='Georgia,serif'%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="pagehead">
  <div class="crumb"><a href="gallery.html">← 返回图册</a></div>
  <h1 id="album-title">图册</h1>
  <p id="album-desc"></p>
</header>

<nav class="nav">
  <a href="index.html">首页</a>
  <a href="timeline.html">大事记</a>
  <a href="gallery.html" class="active">图册</a>
  <a href="documents.html">文件馆</a>
  <a href="about.html">关于</a>
  <a href="memory.html">纪念墙</a>
</nav>

<main>
<section class="section">
  <div class="photo-grid" id="photo-grid"></div>
</section>
</main>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-btn lb-close" id="lb-close" aria-label="关闭">×</button>
  <div class="lb-count" id="lb-count"></div>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="上一张">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="下一张">›</button>
  <div class="lb-caption" id="lb-caption"></div>
</div>

<footer class="footer">
  <p>联动计划 Procxn · 2012–2018 · 纪念档案馆</p>
  <p class="footer-small">本站为老成员自发维护 · 托管于 GitHub Pages · 域名 procxn.org</p>
</footer>

<script src="data.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var album = SITE_DATA.albums.find(function (a) { return a.id === params.get('album'); });
  if (!album) { location.href = 'gallery.html'; return; }

  document.title = album.title + ' · 图册 · 联动计划纪念档案馆';
  var canon = document.createElement('link');
  canon.rel = 'canonical';
  canon.href = 'https://www.procxn.org/album.html?album=' + album.id;
  document.head.appendChild(canon);
  var ogUrl = document.createElement('meta');
  ogUrl.setAttribute('property', 'og:url');
  ogUrl.content = canon.href;
  document.head.appendChild(ogUrl);
  document.getElementById('album-title').textContent = album.title;
  document.getElementById('album-desc').textContent =
    album.year + ' · ' + album.desc;

  var grid = document.getElementById('photo-grid');
  if (!album.photos.length) {
    grid.innerHTML = '<div class="empty-state" style="column-span:all">' +
      '<span class="ico">📷</span>这个图册还没有照片。<br>' +
      '把图片放入 assets/photos/ 并在 data.js 中登记即可收录。</div>';
    return;
  }

  grid.innerHTML = album.photos.map(function (p, i) {
    return '<figure data-i="' + i + '"><img src="' + p.src + '" alt="' + (p.caption || '') + '" loading="lazy">' +
           (p.caption ? '<figcaption>' + p.caption + '</figcaption>' : '') + '</figure>';
  }).join('');

  // 灯箱
  var lb = document.getElementById('lightbox'),
      lbImg = document.getElementById('lb-img'),
      lbCap = document.getElementById('lb-caption'),
      lbCnt = document.getElementById('lb-count'),
      cur = 0;

  function show(i) {
    cur = (i + album.photos.length) % album.photos.length;
    var p = album.photos[cur];
    lbImg.src = p.src;
    lbCap.textContent = p.caption || '';
    lbCnt.textContent = (cur + 1) + ' / ' + album.photos.length;
  }
  function open(i) { show(i); lb.classList.add('open'); }
  function close() { lb.classList.remove('open'); }

  grid.addEventListener('click', function (e) {
    var fig = e.target.closest('figure');
    if (fig) open(+fig.dataset.i);
  });
  document.getElementById('lb-close').onclick = close;
  document.getElementById('lb-prev').onclick = function () { show(cur - 1); };
  document.getElementById('lb-next').onclick = function () { show(cur + 1); };
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
})();
</script>
</body>
</html>
